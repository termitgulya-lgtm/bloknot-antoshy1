
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Блокнот официанта</title>
  <style>
    :root {
      --bg: transparent;
      --card: rgba(255, 255, 255, .95);
      --ink: #202a36;
      --muted: #6c7885;
      --line: #e4e9ee;
      --accent: #176b53;
      --accent-light: #e6f3ed;
      --danger: #b42318;
      --shadow: 0 4px 16px #1c2b3810;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    /* Безопасные отступы системных панелей Android/iOS */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    body { padding-top: var(--safe-top); }
    header { padding-top: 14px; }
    main { padding-bottom: max(24px, var(--safe-bottom)); }
    @media (max-width: 760px) {
      header {
        padding-left: max(14px, env(safe-area-inset-left, 0px));
        padding-right: max(14px, env(safe-area-inset-right, 0px));
      }
      main {
        padding-left: max(12px, env(safe-area-inset-left, 0px));
        padding-right: max(12px, env(safe-area-inset-right, 0px));
      }
    }

    header {
      padding: 18px 24px;
      background: rgba(255, 255, 255, .94);
      border-bottom: 1px solid rgba(255, 255, 255, .55);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 { font-size: 21px; margin: 0; }

    nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 6px;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 16px;
      background: rgba(255,255,255,.78);
      box-shadow: 0 5px 18px rgba(20,55,62,.12);
      backdrop-filter: blur(12px);
    }
    nav button { border-radius: 11px; transition: background .18s ease, color .18s ease, transform .18s ease; }
    nav button.active { background: linear-gradient(135deg,#176b53,#279477); color:#fff; box-shadow:0 3px 9px rgba(23,107,83,.24); }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      background: #edf1f4;
      color: var(--ink);
    }

    button:hover { filter: brightness(.97); }
    button.primary { background: var(--accent); color: white; }
    button.active { background: var(--accent-light); color: var(--accent); }
    button.danger { color: var(--danger); background: #fff0ef; }
    button.small { padding: 6px 9px; font-size: 13px; }

    main {
      max-width: 1200px;
      padding: 24px;
      margin: auto;
    }

    /* Во вкладке «Меню» прокручивается вся страница целиком */
    html.menu-page,
    body.menu-page {
      min-height: 100%;
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body.menu-page main {
      height: auto;
      min-height: calc(100vh - 90px);
      overflow: visible;
    }

    body.menu-page #app {
      min-height: 100%;
      overflow: visible;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    h2 { margin: 0; font-size: 22px; }
    h3 { margin: 0 0 12px; font-size: 17px; }
    .muted { color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .table-card {
      text-align: left;
      cursor: pointer;
      min-height: 0;
      padding: 10px;
    }

    .table-card {
      position: relative;
    }

    .table-icon-action {
      position: absolute;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      min-width: 22px;
      padding: 0 !important;
      border: 0;
      border-radius: 6px;
      line-height: 1;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 3px #0002;
    }

    .table-delete-icon {
      right: 4px;
      bottom: 4px;
      color: #fff;
      background: #d92d20;
      font-size: 18px;
    }

    .table-edit-icon {
      left: 4px;
      bottom: 4px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
    }

    .table-card .table-name,
    .table-card .badge {
      padding-right: 17px;
    }

    .table-card.selected {
      border: 2px solid var(--accent);
      padding: 9px;
    }

    /* Свободные столы — зелёные */
    .table-card:not(.has-order) {
      background: #d8f0e2;
      border-color: #2d8a61;
      box-shadow: inset 0 0 0 1px #2d8a61;
    }

    .table-card:not(.has-order) .badge {
      color: #176b53;
      background: #c7e8d5;
    }

    .table-card:not(.has-order) .actions button {
      background-color: #c7e8d5;
    }

    /* Занятые столы — красные */

    /* Приветствие при каждом открытии приложения */

    }

    .welcome-overlay {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;

    .welcome-card {

      justify-content: center;
      width: 100%;
      height: 100%;

    /* Постер сохраняет пропорции и целиком помещается в экран */
    .welcome-art {

    .welcome-button {
      position: absolute;
      z-index: 2;
      left: 27%;
      top: 88.5%;
      width: 47.5%;
      height: 9%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 24px;

    /* Независимое окно: не меняет размеры main, body или layout. */
    #orderModal[hidden] { display: none !important; }
    #orderModal {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      bottom: env(safe-area-inset-bottom, 0px);

      padding: 12px 12px 24px;
    }

    /* Высота вкладки зависит от реальной высоты шапки и списка столов. */
    @media (max-width: 900px) {
      html.tables-page, body.tables-page {
        height: 100%;
        overflow: hidden;
      }
      body.tables-page {
        height: 100dvh;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-bottom: max(8px, var(--safe-bottom));
      }
      body.tables-page.android-tables {
        padding-bottom: max(32px, var(--safe-bottom));
      }
      body.tables-page > header { flex: 0 0 auto; }
      body.tables-page > #app {
        flex: 1 1 0;
        width: 100%;
        height: auto;
        min-height: 0;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      body.tables-page #app > :not(.layout) { flex: 0 0 auto; }
      body.tables-page #app > .layout {
        flex: 1 1 0;
        height: auto;
        min-height: 0;
        grid-template-rows: minmax(0, 1fr);
      }
      body.tables-page #app .layout > .card {
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 16px;
      }
    }
  
    #exitDialog { position:fixed; inset:0; z-index:30000; display:flex; align-items:center; justify-content:center; padding: max(36px, env(safe-area-inset-top, 0px)) 18px max(36px, env(safe-area-inset-bottom, 0px)); background:rgba(9,35,32,.66); box-sizing:border-box; }
    #exitDialog[hidden] { display:none !important; }
    #exitDialog .exit-card { width:min(100%,380px); max-height:100%; overflow:auto; box-sizing:border-box; padding:24px 18px; border-radius:24px; background:#f8fcfa; color:#20332e; text-align:center; box-shadow:0 18px 60px #0005; }
    #exitDialog .exit-icon { display:grid; place-items:center; width:64px; height:64px; margin:0 auto 14px; border-radius:50%; background:#e0f0eb; color:#176b58; }
    #exitDialog h2 { margin:0 0 10px; font-size:24px; }
    #exitDialog p { margin:0 0 22px; color:#52665e; line-height:1.5; }
    #exitDialog button { display:block; width:100%; min-height:48px; white-space:normal; padding:12px; border-radius:14px; font-size:16px; font-weight:700; }
    #exitStay { background:#176b58; color:white; border:1px solid #176b58; margin-bottom:10px; }
    #exitLeave { background:#fff; color:#a83e36; border:1px solid #bc7770; }

  
    #exitDialog .exit-card { background:#e4f1ed; }
    #exitDialog .exit-icon { background:transparent; font-size:48px; }
    #exitDialog #exitTitle { color:#235e5b; }
    #exitDialog #exitText { color:#456663; }
    #exitDialog #exitStay { background:#347f7c; border-color:#347f7c; color:#fff; }
    #exitDialog #exitLeave { background:#fff; border-color:#fff; color:#347f7c; }
    #exitDialog { backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px); }
    #exitDialog .exit-card { position:relative; z-index:1; border:1px solid #a6ceca; animation:exitAppear .28s ease-out both; }
    #exitDialog .exit-coins { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
    #exitDialog .exit-coin { position:absolute; top:-32px; width:24px; height:24px; border:2px solid #e4b54d; border-radius:50%; background:#f9d77a; color:#8a5919; display:grid; place-items:center; font:bold 15px sans-serif; animation:exitCoin 2.8s linear both; }
    @keyframes exitAppear { from { opacity:0; transform:translateY(12px) scale(.96); } to { opacity:1; transform:none; } }
    @keyframes exitCoin { 0% { transform:translateY(0) rotate(0); opacity:0; } 12% { opacity:1; } 85% { opacity:1; } 100% { transform:translateY(105vh) rotate(420deg); opacity:0; } }
    @media (prefers-reduced-motion:reduce) { #exitDialog .exit-card { animation:none; } #exitDialog .exit-coins { display:none; } }

</style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const STORAGE_KEY = "waiter-notebook-v1";
    // Публичные параметры проекта Supabase. Secret/service_role key здесь не используется.
    const SUPABASE_URL = "https://bukmzdsoujqirnfanaze.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_W1TM2FCEt_36Wt53CLwv6A_ZFHLIXK7";
    const cloud = window.supabase?.createClient
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
      : null;
    let cloudUser = null;
    let cloudProfile = null;
    let cloudGroup = null;
    let cloudRole = null;
    let cloudMessage = "";
    let cloudBusy = false;
    let orderInboxChannel = null;
    let orderInboxPoll = null;
    let sentOrdersCache = [];
    let sentOrdersPoll = null;
    const shownIncomingOrderIds = new Set();

    let pendingInvitations = [];

    function emptyState() {
      return {
        tables: [],
        categories: [],
        menu: [],
        orders: {},
        archive: []
      };
    }

    let state;

    try {
      state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || emptyState();
    } catch {
      state = emptyState();
    }

    // Совместимость со старыми данными
    Object.keys(state.orders || {}).forEach(tableId => {
      const saved = state.orders[tableId];

      if (!saved.bills) {
        const bill = {
          id: makeId(),
          name: "Счёт 1",
          items: (saved.items || []).map(item => ({
            ...item,
            comment: item.comment || ""
          })),
          comment: saved.comment || ""
        };

        state.orders[tableId] = {
          bills: [bill],
          activeBillId: bill.id
        };
      }
    });

    Object.values(state.orders || {}).forEach(tableOrder => {
      (tableOrder.bills || []).forEach(bill => {
        bill.items = (bill.items || []).map(item => ({
          ...item,
          comment: item.comment || ""
        }));
      });
    });

    let view = "tables";
    let selectedTableId = null;
    let expandedCategoryId = state.categories?.[0]?.id || null;

    function toggleCategory(id) {
      expandedCategoryId = expandedCategoryId === id ? null : id;
      render();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function makeId() {
      return Date.now().toString(36) +
        Math.random().toString(36).slice(2, 8);
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function setView(nextView) {
      view = nextView;
      render();
      document.getElementById("nav-" + nextView)?.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
    }

    function addTable() {
      const usedNumbers = new Set(
        state.tables.map(t => String(t.number).trim().toLowerCase())
      );

      let number = 1;
      while (usedNumbers.has(String(number))) number++;

      const table = {
        id: makeId(),
        number: String(number)
      };

      state.tables.push(table);
      selectedTableId = table.id;
      expandedCategoryId = null;

      save();
      render();
    }

    function getTableBills(tableId) {
      if (!state.orders[tableId]) {
        state.orders[tableId] = {
          bills: [],
          activeBillId: null
        };
      }

      return state.orders[tableId].bills;
    }

    function getActiveBill(tableId) {
      const bills = getTableBills(tableId);
      const tableOrder = state.orders[tableId];

      return bills.find(b => b.id === tableOrder.activeBillId)
        || bills[0]
        || null;
    }

    function addBill(tableId) {
      const bills = getTableBills(tableId);

      const bill = {
        id: makeId(),
        name: `Счёт ${bills.length + 1}`,
        items: [],
        comment: ""
      };

      bills.push(bill);
      state.orders[tableId].activeBillId = bill.id;

      save();
      render();
    }

    function selectBill(tableId, billId) {
      if (!state.orders[tableId]?.bills?.some(b => b.id === billId)) {
        return;
      }

      state.orders[tableId].activeBillId = billId;
      save();
      render();
    }

    function updateOrderComment(tableId, billId, value) {
      const bill = getTableBills(tableId).find(b => b.id === billId);
      if (!bill) return;

      bill.comment = value;
      save();
    }

    function renameTable(id) {
      const table = state.tables.find(t => t.id === id);
      if (!table) return;

      // Закрываем ранее открытое окно, если оно осталось на экране.
      document.querySelector(".rename-overlay")?.remove();

      const overlay = document.createElement("div");
      overlay.className = "rename-overlay";
      overlay.innerHTML = `
        <div class="rename-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="renameTableTitle">

          <h3 id="renameTableTitle">Изменить номер стола</h3>

          <input
            id="renameTableInput"
            type="text"
            inputmode="text"
            autocomplete="off"
            aria-label="Новый номер стола"
            value="${esc(table.number)}"
          >

          <div class="rename-actions">
            <button type="button" id="renameTableCancel">Отмена</button>
            <button type="button" class="primary" id="renameTableSave">
              Сохранить
            </button>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      const input = overlay.querySelector("#renameTableInput");
      const cancelButton = overlay.querySelector("#renameTableCancel");
      const saveButton = overlay.querySelector("#renameTableSave");

      function closeDialog() {
        input.blur();
        overlay.remove();
        document.body.classList.remove("keyboard-open");
      }

      function saveTableNumber() {
        const number = input.value.trim();

        if (!number) {
          alert("Введите номер стола.");
          input.focus();
          return;
        }

        const duplicate = state.tables.some(t =>
          t.id !== id &&
          String(t.number).trim().toLowerCase() === number.toLowerCase()
        );

        if (duplicate) {
          alert("Стол с таким номером уже существует.");
          input.focus();
          input.select();
          return;
        }

        table.number = number;
        save();
        closeDialog();
        render();
      }

      cancelButton.addEventListener("click", closeDialog);
      saveButton.addEventListener("click", saveTableNumber);

      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          saveTableNumber();
        }

        if (event.key === "Escape") {
          event.preventDefault();
          closeDialog();
        }
      });

      overlay.addEventListener("click", event => {
        if (event.target === overlay) closeDialog();
      });

      // Небольшая задержка нужна мобильным браузерам для корректного фокуса.
      requestAnimationFrame(() => {
        input.focus();
        input.select();
      });
    }

    function deleteTable(id) {
      const table = state.tables.find(t => t.id === id);
      if (!table) return;

      if (state.orders[id]?.bills?.some(b => b.items?.length)) {
        alert("Нельзя удалить стол, пока для него есть незавершённые счета.");
        return;
      }

      if (!confirm(`Удалить стол №${table.number}?`)) return;

      state.tables = state.tables.filter(t => t.id !== id);
      delete state.orders[id];

      if (selectedTableId === id) selectedTableId = null;

      save();
      render();
    }

    // Универсальное окно ввода вместо системного prompt().
    // После сохранения/отмены поле теряет фокус, поэтому мобильная
    // клавиатура закрывается вместе с окном.
    function showFormDialog({ title, fields, saveLabel = "Сохранить", onSave }) {
      document.querySelector(".form-dialog-overlay")?.remove();

      const overlay = document.createElement("div");
      overlay.className = "rename-overlay form-dialog-overlay";

      const fieldMarkup = fields.map((field, index) => {
        const id = `formDialogField${index}`;
        const label = esc(field.label);
        if (field.type === "select") {
          const options = (field.options || []).map(option =>
            `<option value="${esc(option.value)}"${
              String(option.value) === String(field.value) ? " selected" : ""
            }>${esc(option.label)}</option>`
          ).join("");

          return `
            <div class="form-dialog-field">
              <label for="${id}">${label}</label>
              <select id="${id}" name="${esc(field.name || id)}">
                ${options}
              </select>
            </div>
          `;
        }

        return `
          <div class="form-dialog-field">
            <label for="${id}">${label}</label>
            <input
              id="${id}"
              name="${esc(field.name || id)}"
              type="${field.type === "number" ? "number" : "text"}"
              ${field.type === "number" ? 'inputmode="decimal" step="any" min="0"' : 'inputmode="text"'}
              autocomplete="off"
              value="${esc(field.value ?? "")}"
              ${field.required === false ? "" : "required"}
            >
          </div>
        `;
      }).join("");

      overlay.innerHTML = `
        <div class="rename-dialog" role="dialog" aria-modal="true">
          <h3>${esc(title)}</h3>
          <form id="formDialogForm">
            <div class="form-dialog-fields">${fieldMarkup}</div>
            <div class="rename-actions">
              <button type="button" id="formDialogCancel">Отмена</button>
              <button type="submit" class="primary">${esc(saveLabel)}</button>
            </div>
          </form>
        </div>
      `;

      document.body.appendChild(overlay);

      const form = overlay.querySelector("#formDialogForm");
      const cancelButton = overlay.querySelector("#formDialogCancel");
      const controls = [...overlay.querySelectorAll("input, select")];

      function closeDialog() {
        controls.forEach(control => control.blur());
        if (document.activeElement?.blur) document.activeElement.blur();
        overlay.remove();
        document.body.classList.remove("keyboard-open");
      }

      function submitDialog(event) {
        event.preventDefault();

        const values = controls.map(control => control.value.trim());

        for (let i = 0; i < fields.length; i++) {
          if (fields[i].required !== false && !values[i]) {
            alert(`Заполните поле «${fields[i].label}».`);
            controls[i].focus();
            return;
          }
        }

        const result = {};
        fields.forEach((field, index) => {
          result[field.name || `field${index}`] = values[index];
        });

        // Сначала закрываем окно и клавиатуру, затем обновляем интерфейс.
        closeDialog();
        onSave(result);
      }

      form.addEventListener("submit", submitDialog);
      cancelButton.addEventListener("click", closeDialog);

      overlay.addEventListener("click", event => {
        if (event.target === overlay) closeDialog();
      });

      overlay.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          event.preventDefault();
          closeDialog();
        }
      });

      // Небольшая задержка помогает мобильным браузерам правильно
      // открыть клавиатуру уже после появления окна.
      requestAnimationFrame(() => {
        const firstInput = controls.find(control => control.tagName === "INPUT");
        if (firstInput) {
          firstInput.focus();
          firstInput.select?.();
        }
      });
    }

    function deleteCategory(id) {

      const categoryOptions = state.categories.map(category => ({

    function deleteMenuItem(id) {

    function addToOrder(tableId, menuItemId) {
      const item = state.menu.find(i => i.id === menuItemId);
      if (!item) return;

      let order = getActiveBill(tableId);

      if (!order) {
        addBill(tableId);
        order = getActiveBill(tableId);
      }

      const existing = order.items.find(i => i.menuItemId === item.id);

      if (existing) {
        existing.qty += 1;
      } else {
        order.items.push({
          menuItemId: item.id,
          name: item.name,
          qty: 1
        });
      }

      save();
      render();

      // Прокручиваем панель непосредственно к добавленному блюду,
      // а не просто в самый конец заказа.
      requestAnimationFrame(() => {
        const orderPanel = document.querySelector(".order-screen");
        if (!orderPanel) return;

        const addedRow = Array.from(
          orderPanel.querySelectorAll(".order-row[data-order-item-id]")
        ).find(row => row.dataset.orderItemId === String(item.id));

        if (addedRow) {
          // Подсвечиваем добавленную позицию двумя быстрыми жёлтыми миганиями.
          addedRow.classList.remove("blink-yellow");
          void addedRow.offsetWidth; // Перезапускаем анимацию при повторном добавлении.
          addedRow.classList.add("blink-yellow");

          addedRow.addEventListener("animationend", () => {
            addedRow.classList.remove("blink-yellow");
          }, { once: true });

          const scroller = orderModalOpen ? orderPanel.querySelector(".order-screen-scroll") : orderPanel;
          const delta = addedRow.getBoundingClientRect().bottom - scroller.getBoundingClientRect().bottom;
          if (delta > 0) scroller.scrollBy({ top: delta + 8, behavior: "smooth" });
          else if (addedRow.getBoundingClientRect().top < scroller.getBoundingClientRect().top) {
            scroller.scrollBy({ top: addedRow.getBoundingClientRect().top - scroller.getBoundingClientRect().top - 8, behavior: "smooth" });
          }
        }
      });
    }

    function updateItemComment(tableId, billId, index, value) {
      const bill = getTableBills(tableId).find(b => b.id === billId);
      const item = bill?.items?.[index];

      if (!item) return;

      item.comment = value;
      save();
    }

    function changeQty(tableId, index, change) {
      const order = getActiveBill(tableId);
      if (!order) return;

      const item = order.items[index];
      if (!item) return;

      item.qty += change;

      if (item.qty <= 0) {
        order.items.splice(index, 1);
      }

      save();
      render();
    }

    async function shareOrder(tableId) {
      const table = state.tables.find(t => t.id === tableId);
      const order = getActiveBill(tableId);
      if (!table || !order || !order.items?.length) {
        alert("В этом счёте пока нет позиций для отправки.");
        return;
      }

      if (cloudUser && cloudGroup) {
        await openOrderRecipientPicker(tableId);
        return;
      }

      const message = buildOrderText(table, order);
      const title = `Заказ — стол №${table.number}`;
      if (navigator.share) {
        try { await navigator.share({ title, text: message }); return; }
        catch (error) { if (error?.name === "AbortError") return; }
      }
      try {
        if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(message);
        else {
          const textarea = document.createElement("textarea");
          textarea.value = message; textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed"; textarea.style.opacity = "0";
          document.body.appendChild(textarea); textarea.select();
          const copied = document.execCommand("copy"); textarea.remove();
          if (!copied) throw new Error("Не удалось скопировать текст");
        }
        alert("Текст заказа скопирован. Можно отправить его через мессенджер.");
      } catch { prompt("Скопируйте текст заказа:", message); }
    }

    function buildOrderText(table, order) {
      const lines = [`Заказ — стол №${table.number}`, order.name || "Счёт", ""];
      (order.items || []).forEach(item => {
        lines.push(`${item.name} — ${item.qty} шт.`);
        if (item.comment?.trim()) lines.push(`  Комментарий: ${item.comment.trim()}`);
      });
      if (order.comment?.trim()) lines.push("", `Комментарий к счёту: ${order.comment.trim()}`);
      return lines.join("\n");
    }

    async function openOrderRecipientPicker(tableId) {
      if (!cloudUser || !cloudGroup) return alert("Для отправки заказа напрямую нужно войти в группу официантов.");
      const { data: members, error } = await cloud.from("waiter_group_members")
        .select("user_id,role").eq("group_id", cloudGroup.id);
      if (error) return alert("Не удалось загрузить список официантов: " + error.message);
      const ids = (members || []).filter(m => m.user_id !== cloudUser.id).map(m => m.user_id);
      const { data: profiles, error: profileError } = ids.length
        ? await cloud.from("waiter_profiles").select("user_id,full_name,phone").in("user_id", ids)
        : { data: [], error: null };
      if (profileError) return alert("Не удалось загрузить анкеты официантов: " + profileError.message);
      const byId = Object.fromEntries((profiles || []).map(p => [p.user_id, p]));
      const backdrop = document.createElement("div");
      backdrop.className = "order-share-backdrop";
      backdrop.id = "order-share-backdrop";
      const rows = (members || []).filter(m => m.user_id !== cloudUser.id).map(m => {
        const p = byId[m.user_id] || {};
        return `<button class="order-recipient" onclick="sendOrderToWaiter('${tableId}','${m.user_id}')">
          <span><strong>${esc(p.full_name || "Официант без имени")}</strong><small>${m.role === "admin" ? "Администратор" : "Официант"}${p.phone ? " · " + esc(p.phone) : ""}</small></span>
          <span>Отправить →</span>
        </button>`;
      }).join("") || `<p>В группе пока нет других официантов.</p>`;
      backdrop.innerHTML = `<section class="order-share-dialog" role="dialog" aria-modal="true">
        <h3>Кому отправить заказ?</h3>
        <p>Выберите официанта. Заказ поступит прямо в его приложение.</p>
        ${rows}
        <div class="order-dialog-actions"><button onclick="closeOrderShareDialog()">Отмена</button></div>
      </section>`;
      backdrop.addEventListener("click", e => { if (e.target === backdrop) closeOrderShareDialog(); });
      document.body.appendChild(backdrop);
    }

    function closeOrderShareDialog() { document.getElementById("order-share-backdrop")?.remove(); }

    async function sendOrderToWaiter(tableId, recipientId) {
      const table = state.tables.find(t => t.id === tableId);
      const order = getActiveBill(tableId);
      if (!table || !order?.items?.length) return alert("Заказ уже изменён или пуст.");
      const payload = {
        source_table: String(table.number),
        source_table_id: tableId,
        source_bill_id: order.id,
        bill_name: order.name || "Полученный заказ",
        comment: order.comment || "",
        items: (order.items || []).map(i => ({ name: i.name, qty: Number(i.qty) || 1, comment: i.comment || "" })),
        sender_name: cloudProfile?.full_name || cloudUser.email || "Официант"
      };
      const { error } = await cloud.rpc("send_waiter_order", {
        p_recipient_id: recipientId,
        p_order_data: payload
      });
      if (error) return alert("Не удалось отправить заказ: " + error.message);
      closeOrderShareDialog();
      alert("Заказ отправлен. Он появится в приложении выбранного официанта.");
    }

    function showIncomingOrder(message) {
      if (!message?.id || shownIncomingOrderIds.has(message.id)) return;
      shownIncomingOrderIds.add(message.id);
      const data = message.order_data || {};
      const itemsHtml = (data.items || []).map(i =>
        `<p>• ${esc(i.name)} × ${Number(i.qty) || 1}${i.comment ? " — " + esc(i.comment) : ""}</p>`
      ).join("");
      const backdrop = document.createElement("div");
      backdrop.className = "incoming-order-backdrop";
      backdrop.id = "incoming-order-" + message.id;
      backdrop.innerHTML = `<section class="incoming-order-dialog" role="dialog" aria-modal="true">
        <h3>Новый заказ от коллеги</h3>
        <p><strong>${esc(message.sender_name || "Официант")}</strong> отправил заказ со стола №${esc(data.source_table || "—")}.</p>
        <div class="incoming-order-items">${itemsHtml || "<p>Список блюд пуст.</p>"}${data.comment ? `<p><strong>Комментарий:</strong> ${esc(data.comment)}</p>` : ""}</div>
        <div class="order-dialog-actions">
          <button class="primary" onclick="acceptIncomingOrder('${message.id}')">Принять заказ</button>
          <button onclick="dismissIncomingOrder('${message.id}')">Позже</button>
        </div>
      </section>`;
      document.body.appendChild(backdrop);
    }

    async function acceptIncomingOrder(messageId) {
      if (!cloud || !cloudUser) return alert("Требуется подключение к группе.");
      const { data: msg, error } = await cloud.rpc("accept_waiter_order", { p_message_id: messageId });
      if (error || !msg) return alert("Не удалось принять заказ: " + (error?.message || "заказ не найден"));
      const payload = msg.order_data || {};
      const alreadyAdded = Object.values(state.orders || {}).some(o =>
        (o.bills || []).some(b => b.sourceMessageId === messageId)
      );
      if (!alreadyAdded) {
        const tableNumber = String(payload.source_table || "Полученный");
        let table = state.tables.find(t => String(t.number) === tableNumber);
        if (!table) {
          table = { id: makeId(), number: tableNumber };
          state.tables.push(table);
        }
        const bills = getTableBills(table.id);
        const bill = {
          id: makeId(), sourceMessageId: messageId,
          name: `${payload.bill_name || "Полученный заказ"} · от ${msg.sender_name || "коллеги"}`,
          items: (payload.items || []).map(i => ({ menuItemId: null, name: String(i.name || "Блюдо"), qty: Math.max(1, Number(i.qty) || 1), comment: String(i.comment || "") })),
          comment: payload.comment || ""
        };
        bills.push(bill);
        state.orders[table.id].activeBillId = bill.id;
        save();
      }
      document.getElementById("incoming-order-" + messageId)?.remove();
      selectedTableId = state.tables.find(t => (state.orders[t.id]?.bills || []).some(b => b.sourceMessageId === messageId))?.id || null;
      view = "tables"; render();
      alert(alreadyAdded ? "Этот заказ уже был добавлен ранее." : "Заказ принят и добавлен отдельным счётом. Отправитель увидит статус «Принят».");
    }

    async function dismissIncomingOrder(messageId) {
      await cloud.from("waiter_order_messages").update({ read_at: new Date().toISOString() }).eq("id", messageId);
      document.getElementById("incoming-order-" + messageId)?.remove();
    }

    async function checkIncomingOrders() {
      if (!cloudUser || !cloudGroup || !cloud) return;
      const { data, error } = await cloud.from("waiter_order_messages")
        .select("id,sender_name,order_data,created_at,accepted_at")
        .eq("recipient_id", cloudUser.id).is("read_at", null).is("accepted_at", null)
        .order("created_at", { ascending: true }).limit(10);
      if (error) { console.warn("Inbox check:", error.message); return; }
      (data || []).forEach(showIncomingOrder);
    }

    function startOrderInbox() {
      if (!cloud || !cloudUser || !cloudGroup) {
        if (orderInboxChannel) cloud.removeChannel(orderInboxChannel);
        orderInboxChannel = null;
        if (orderInboxPoll) clearInterval(orderInboxPoll);
        orderInboxPoll = null;
        if (sentOrdersPoll) clearInterval(sentOrdersPoll);
        sentOrdersPoll = null;
        return;
      }
      if (orderInboxChannel) cloud.removeChannel(orderInboxChannel);
      orderInboxChannel = cloud.channel("waiter-orders-" + cloudUser.id)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "waiter_order_messages", filter: "recipient_id=eq." + cloudUser.id }, payload => {
          showIncomingOrder(payload.new);
        })
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "waiter_order_messages", filter: "sender_id=eq." + cloudUser.id }, () => {
          loadSentOrders();
        }).subscribe();
      checkIncomingOrders();
      loadSentOrders();
      if (orderInboxPoll) clearInterval(orderInboxPoll);
      orderInboxPoll = setInterval(checkIncomingOrders, 12000);
      if (sentOrdersPoll) clearInterval(sentOrdersPoll);
      sentOrdersPoll = setInterval(loadSentOrders, 15000);
    }

    function finishOrder(tableId) {
      const order = getActiveBill(tableId);
      const table = state.tables.find(t => t.id === tableId);

      if (!order?.items?.length || !table) return;

      if (!confirm(
        `Завершить ${order.name.toLowerCase()} для стола №${table.number}?`
      )) return;

      state.archive.unshift({
        id: makeId(),
        tableNumber: table.number,
        billName: order.name,
        finishedAt: new Date().toISOString(),
        items: order.items.map(i => ({
          menuItemId: i.menuItemId,
          name: i.name,
          qty: i.qty,
          comment: i.comment || ""
        })),
        comment: order.comment || ""
      });

      const tableOrder = state.orders[tableId];

      tableOrder.bills = tableOrder.bills.filter(b => b.id !== order.id);

      if (tableOrder.bills.length) {
        tableOrder.activeBillId = tableOrder.bills[0].id;
      } else {
        delete state.orders[tableId];
      }

      save();
      render();
    }

    let orderModalOpen = false;
    let orderPlaceholder = null;
    let normalOrderScroll = 0;
    let normalViewportScroll = null;

    function mountOrderModal(scrollTop = 0) {
      const panel = document.querySelector("#app .order-screen");
      if (!panel) return false;
      const modal = document.getElementById("orderModal");
      orderPlaceholder = document.createElement("div");
      orderPlaceholder.setAttribute("aria-hidden", "true");
      panel.replaceWith(orderPlaceholder);
      modal.append(panel);
      modal.classList.toggle("android-insets", /Android/i.test(navigator.userAgent));
      modal.hidden = false;
      document.getElementById("app").inert = true;
      document.querySelector("body > header").inert = true;
      panel.querySelector("#toggleOrderFullscreen").textContent = "Скрыть";
      panel.querySelector(".order-screen-scroll").scrollTop = scrollTop;
      return true;
    }

    function closeOrderModal() {
      const modal = document.getElementById("orderModal");
      const panel = modal.querySelector(".order-screen");
      if (panel && orderPlaceholder?.isConnected) {
        orderPlaceholder.replaceWith(panel);
        panel.querySelector("#toggleOrderFullscreen").textContent = "Показать экран";
        panel.scrollTop = normalOrderScroll;
      }
      modal.replaceChildren();
      modal.hidden = true;
      orderPlaceholder = null;
      orderModalOpen = false;
      document.getElementById("app").inert = false;
      document.querySelector("body > header").inert = false;
      if (normalViewportScroll) {
        document.getElementById("app").scrollTop = normalViewportScroll.main;
        window.scrollTo(normalViewportScroll.x, normalViewportScroll.y);
      }
      normalViewportScroll = null;
    }

    function toggleOrderFullscreen() {
      if (orderModalOpen) { closeOrderModal(); return; }
      const panel = document.querySelector("#app .order-screen");
      if (!panel) return;
      normalOrderScroll = panel.scrollTop;
      normalViewportScroll = { x: window.scrollX, y: window.scrollY, main: document.getElementById("app").scrollTop };
      orderModalOpen = mountOrderModal();
    }

            );

        const order = getActiveBill(selected.id);

        const billTabs = `
          <div class="actions" style="margin:10px 0 14px">

              <button class="small ${
                bill.id === order.id ? "active" : ""
              }" onclick="selectBill('${selected.id}','${bill.id}')">
                ${esc(bill.name)}${
                  bill.items.length
                    ? ` · ${bill.items.reduce((n, i) => n + i.qty, 0)}`
                    : ""
                }
              </button>
            `).join("")}

            <button class="small primary" onclick="addBill('${selected.id}')">
              ＋ Новый счёт
            </button>
          </div>
        `;

        const orderItems = order.items.map((item, index) => `
          <div class="order-row" data-order-item-id="${esc(item.menuItemId)}">
            <div>
              <div class="item-title">${esc(item.name)}</div>
              <input
                type="text"
                value="${esc(item.comment || "")}"
                placeholder="Комментарий к блюду..."
                aria-label="Комментарий к блюду ${esc(item.name)}"
                style="display:block;width:100%;max-width:260px;margin-top:6px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px"
                oninput="updateItemComment('${selected.id}', '${order.id}', ${index}, this.value)"
              >
            </div>

            <div class="item-actions">
              <button class="small" onclick="changeQty('${selected.id}',${index},-1)">−</button>
              <strong>${item.qty}</strong>
              <button class="small" onclick="changeQty('${selected.id}',${index},1)">+</button>
            </div>
          </div>
        `).join("");

        const menuSections = state.categories
          .slice()
          .sort((a, b) => a.name.localeCompare(b.name, "ru", { sensitivity: "base" }))
          .map(category => {
          const items = state.menu
            .filter(i => i.categoryId === category.id)
            .sort((a, b) => a.name.localeCompare(b.name, "ru", { sensitivity: "base" }));

          if (!items.length) return "";

          const isCollapsed = expandedCategoryId !== category.id;

          return `
            <div class="section-title collapsible-header"
              onclick="toggleCategory('${category.id}')">
              <span>${isCollapsed ? "▸" : "▾"}</span>
              <span><span class="category-name">${esc(category.name)}</span> (${items.length})</span>
            </div>

            ${isCollapsed ? "" : items.map(item => `
              <div class="menu-row">
                <div>
                  <div class="item-title">${esc(item.name)}</div>
                </div>

                <button class="primary small"
                  onclick="addToOrder('${selected.id}','${item.id}')">
                  Добавить
                </button>
              </div>
            `).join("")}
          `;
        }).join("");

        orderPanel = `
          <div class="layout">
            <section class="card">
              <h3>Меню</h3>
              ${menuSections ||
                `<p class="muted">Добавьте категории и позиции в разделе «Меню».</p>`
              }
            </section>

            <section class="card order-screen">
              <div class="order-screen-header">
                <h3>Заказ — стол №${esc(selected.number)}</h3>
                <button
                  id="toggleOrderFullscreen"
                  class="small primary"
                  onclick="toggleOrderFullscreen()">
                  ${orderModalOpen ? "Скрыть" : "Показать экран"}
                </button>
              </div>

              <div class="order-screen-scroll">
              ${billTabs}

              <div class="muted" style="font-size:13px;margin-bottom:8px">
                ${esc(order.name)}
              </div>

              ${orderItems ||
                `<p class="muted">В этом счёте пока нет позиций.</p>`
              }

              <div class="order-footer">
                <div class="actions">
                  <button
                    onclick="shareOrder('${selected.id}')"
                    ${order.items.length ? "" : "disabled"}>
                    Поделиться заказом
                  </button>
                  <button class="primary"
                    onclick="finishOrder('${selected.id}')"
                    ${order.items.length ? "" : "disabled"}>
                    Завершить
                  </button>
                </div>
              </div>
              </div>
            </section>
          </div>
        `;
      }

      return `
        <div class="toolbar">
          <h2>Столы и заказы</h2>
          <button class="primary" onclick="addTable()">＋ Добавить стол</button>
        </div>

        ${tableCards}
        <div style="height:20px"></div>
        ${orderPanel}
      `;
    }

    function renderMenu() {
      const categories = state.categories
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name, "ru", { sensitivity: "base" }))
        .map(category => {
        const items = state.menu
          .filter(i => i.categoryId === category.id)
          .sort((a, b) => a.name.localeCompare(b.name, "ru", { sensitivity: "base" }));

        const isCollapsed = expandedCategoryId !== category.id;

        return `
          <section class="card" style="margin-bottom:14px">
            <div class="toolbar"
              style="margin-bottom:${isCollapsed ? "0" : "8px"}">

              <h3 class="collapsible-header"
                style="margin:0"
                onclick="toggleCategory('${category.id}')">

                <span>${isCollapsed ? "▸" : "▾"}</span>
                <span>
                  <span class="category-name">${esc(category.name)}</span>
                  <span class="muted">(${items.length})</span>
                </span>
              </h3>

              ${isCloudAdmin() ? `<div class="actions">
                <button class="small"
                  onclick="addMenuItem('${category.id}')">
                  ＋ Позиция
                </button>

                <button class="small"
                  onclick="renameCategory('${category.id}')">
                  Изменить
                </button>

                <button class="small danger"
                  onclick="deleteCategory('${category.id}')">
                  Удалить
                </button>
              </div>` : `<span class="profile-note">Только просмотр</span>`}
            </div>

            ${isCollapsed ? "" : (
              items.length
                ? items.map(item => `
                    <div class="menu-row">
                      <div>
                        <div class="item-title">${esc(item.name)}</div>
                            </div>

                      ${isCloudAdmin() ? `<div class="actions">
                        <button class="small"
                          onclick="editMenuItem('${item.id}')">
                          Редактировать
                        </button>

                        <button class="small danger"
                          onclick="deleteMenuItem('${item.id}')">
                          Удалить
                        </button>
                      </div>` : ``}
                    </div>
                  `).join("")
                : `<p class="muted">В этой категории пока нет позиций.</p>`
            )}
          </section>
        `;
      }).join("");

      return `
        <div class="toolbar">
          <h2>Меню</h2>

          ${isCloudAdmin() ? `<div class="actions">
            <button class="primary" onclick="addCategory()">
              ＋ Категория
            </button>

            <button onclick="addMenuItem()">
              ＋ Позиция меню
            </button>
          </div>` : `<span class="profile-note">Изменение меню доступно только администратору группы. <a href="#" onclick="setView('settings');return false">Открыть настройки</a></span>`}
        </div>

        ${categories ||
          `<div class="empty">
            Категорий пока нет. Создайте категорию, затем добавьте блюда и напитки.
          </div>`
        }
      `;
    }

    function isCloudAdmin() {
      return !!cloudUser && !!cloudGroup && cloudRole === "admin";
    }

    function cloudStatusText() {
      if (!cloud) return "Не удалось загрузить библиотеку Supabase. Проверьте подключение к интернету.";
      if (!cloudUser) return "Войдите в аккаунт, чтобы создать группу или присоединиться к ней.";
      if (!cloudGroup) return "Аккаунт подключён. Создайте группу или вступите по коду.";
      return `Группа: ${esc(cloudGroup.name)} · Роль: ${cloudRole === "admin" ? "администратор" : "официант"}`;
    }

    function renderSettings() {
      const authBlock = cloudUser ? `
        <div class="settings-card">
          <h3>Аккаунт</h3>
          <p class="profile-note">Вход выполнен: ${esc(cloudUser.email || "")}</p>
          <button class="small danger" onclick="cloudSignOut()">Выйти из аккаунта</button>
        </div>` : `
        <div class="settings-card">
          <h3>Вход и регистрация</h3>
          <label for="cloud-email">Электронная почта</label>
          <input id="cloud-email" type="email" autocomplete="email" placeholder="name@example.com">
          <label for="cloud-password">Пароль</label>
          <input id="cloud-password" type="password" autocomplete="current-password" placeholder="Не менее 6 символов">
          <div class="actions" style="margin-top:12px">
            <button class="primary" onclick="cloudSignIn()">Войти</button>
            <button onclick="cloudSignUp()">Создать аккаунт</button>
          </div>
          <p class="profile-note">Для каждого официанта нужен отдельный аккаунт. Если включено подтверждение почты, сначала откройте письмо Supabase.</p>
        </div>`;

      const profileBlock = cloudUser ? `
        <div class="settings-card">
          <h3>Профиль официанта</h3>
          <label for="waiter-full-name">Имя и фамилия</label>
          <input id="waiter-full-name" value="${esc(cloudProfile?.full_name || "")}" placeholder="Например, Антон Иванов">
          <label for="waiter-phone">Номер телефона</label>
          <input id="waiter-phone" type="tel" value="${esc(cloudProfile?.phone || "")}" placeholder="+380...">
          <button class="primary" style="margin-top:12px" onclick="saveCloudProfile()">Сохранить профиль</button>
        </div>` : "";

      let groupBlock = "";
      if (cloudUser && !cloudGroup) groupBlock = `
        <div class="settings-card">
          <h3>Группа официантов</h3>
          <label for="new-group-name">Создать новую группу</label>
          <input id="new-group-name" placeholder="Например, Основная смена">
          <button class="primary" style="margin-top:10px" onclick="createWaiterGroup()">Создать группу</button>
          <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
          <label for="join-group-code">Вступить по коду приглашения</label>
          <input id="join-group-code" placeholder="Например, A1B2C3D4">
          <button style="margin-top:10px" onclick="joinWaiterGroup()">Вступить в группу</button>
        </div>`;
      else if (cloudUser && cloudGroup) groupBlock = `
        <div class="settings-card">
          <h3>Группа официантов</h3>
          <p><strong>${esc(cloudGroup.name)}</strong></p>
          ${cloudRole === "admin" ? `<p class="profile-note">Код приглашения: <strong>${esc(cloudGroup.join_code)}</strong></p>` : ""}
          <button class="small" onclick="refreshCloudGroup()">Обновить данные группы</button>
          ${cloudRole === "admin" ? `
            <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
            <h4>Пригласить по номеру телефона</h4>
            <label for="invite-phone">Номер телефона сотрудника</label>
            <input id="invite-phone" type="tel" placeholder="+380...">
            <button class="primary" style="margin-top:10px" onclick="inviteWaiterByPhone()">Создать приглашение</button>
          ` : `<p class="profile-note">Попросите администратора пригласить вас по номеру телефона или передать код группы.</p>`}
          <div id="cloud-members" class="profile-note" style="margin-top:12px">Список участников загружается по кнопке «Обновить данные группы».</div>
          <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
          <button class="small" style="background:#fff0ed;color:#a33325;border:1px solid #efc4bd" onclick="leaveWaiterGroup()">Выйти из группы</button>
          <p class="profile-note">При выходе доступ к общему меню и участникам группы будет прекращён. Личные заказы на этом устройстве останутся.</p>
        </div>`;

      const invitationsBlock = cloudUser ? `
        <div class="settings-card">
          <h3>Приглашения для меня</h3>
          <button class="small" onclick="loadMyInvitations()">Проверить приглашения</button>
          <div style="margin-top:10px">${pendingInvitations.length ? pendingInvitations.map(i => `
            <div style="padding:10px 0;border-top:1px solid var(--line)">
              <strong>${esc(i.group_name)}</strong><br>
              <button class="small primary" style="margin-top:8px" onclick="acceptPhoneInvitation('${i.invitation_id}')">Принять приглашение</button>
            </div>`).join("") : `<span class="profile-note">Новых приглашений пока нет.</span>`}</div>
        </div>` : "";

      const menuSyncBlock = cloudUser && cloudGroup ? `
        <div class="settings-card">
          <h3>Общее меню группы</h3>
          ${cloudRole === "admin" ? `<p class="profile-note">Администратор может отправить текущее меню всем участникам. Официанты смогут загрузить общее меню на свой телефон.</p>` : ""}
          ${cloudRole === "admin" ? `<button class="primary" onclick="publishSharedMenu()">Опубликовать моё меню для группы</button>` : ""}
          <button style="margin-top:8px" onclick="downloadSharedMenu()">Загрузить / обновить общее меню</button>
          <p class="profile-note">Эту кнопку можно использовать повторно, когда администратор обновит меню.</p>
        </div>` : "";

      return `<div class="settings-wrap">
        <div class="toolbar"><h2>Настройки и группа</h2></div>
        <div class="settings-card"><strong>Состояние подключения</strong><p class="profile-note">${cloudStatusText()}</p>${cloudMessage ? `<p role="status">${esc(cloudMessage)}</p>` : ""}</div>
        ${authBlock}${profileBlock}${groupBlock}${invitationsBlock}${menuSyncBlock}
      </div>`;
    }

    async function cloudSignUp() {
      if (!cloud) return alert("Supabase не загрузился. Проверьте интернет-соединение.");
      const email = document.getElementById("cloud-email")?.value.trim();
      const password = document.getElementById("cloud-password")?.value || "";
      if (!email || password.length < 6) return alert("Введите email и пароль не короче 6 символов.");
      cloudBusy = true;
      const { data, error } = await cloud.auth.signUp({ email, password });
      cloudBusy = false;
      if (error) return alert("Не удалось создать аккаунт: " + error.message);
      if (!data.session) alert("Аккаунт создан. Проверьте почту и подтвердите адрес, затем войдите в приложение.");
      await refreshCloudSession();
    }

    async function cloudSignIn() {
      if (!cloud) return alert("Supabase не загрузился. Проверьте интернет-соединение.");
      const email = document.getElementById("cloud-email")?.value.trim();
      const password = document.getElementById("cloud-password")?.value || "";
      if (!email || !password) return alert("Введите email и пароль.");
      const { error } = await cloud.auth.signInWithPassword({ email, password });
      if (error) return alert("Не удалось войти: " + error.message);
      await refreshCloudSession();
    }

    async function cloudSignOut() {
      if (!cloud) return;
      await cloud.auth.signOut();
      cloudUser = cloudProfile = cloudGroup = cloudRole = null;
      pendingInvitations = [];
      cloudMessage = "Вы вышли из аккаунта.";
      render();
    }

    async function refreshCloudSession() {
      if (!cloud) return;
      const { data } = await cloud.auth.getSession();
      cloudUser = data.session?.user || null;
      cloudProfile = null; cloudGroup = null; cloudRole = null;
      if (cloudUser) {
        const { data: profile } = await cloud.from("waiter_profiles").select("user_id,full_name,phone").eq("user_id", cloudUser.id).maybeSingle();
        cloudProfile = profile || { user_id: cloudUser.id, full_name: "", phone: "" };
        const { data: membership, error } = await cloud.from("waiter_group_members").select("group_id,role").eq("user_id", cloudUser.id).limit(1).maybeSingle();
        if (membership && !error) {
          cloudRole = membership.role;
          const { data: group } = await cloud.from("waiter_groups").select("id,name,join_code").eq("id", membership.group_id).maybeSingle();
          cloudGroup = group || null;
        }
      }
      render();
      startOrderInbox();
    }

    async function saveCloudProfile() {
      if (!cloudUser) return;
      const full_name = document.getElementById("waiter-full-name")?.value.trim() || "";
      const phone = document.getElementById("waiter-phone")?.value.trim() || "";
      const { error } = await cloud.from("waiter_profiles").upsert({ user_id: cloudUser.id, full_name, phone, updated_at: new Date().toISOString() });
      if (error) return alert("Не удалось сохранить профиль: " + error.message);
      cloudProfile = { user_id: cloudUser.id, full_name, phone };
      cloudMessage = "Профиль сохранён."; render();
    }

    async function createWaiterGroup() {
      const name = document.getElementById("new-group-name")?.value.trim();
      if (!name) return alert("Введите название группы.");
      const { data, error } = await cloud.rpc("create_waiter_group", { p_name: name });
      if (error) return alert("Не удалось создать группу: " + error.message);
      cloudMessage = "Группа создана. Вы назначены администратором.";
      await refreshCloudSession();
    }

    async function joinWaiterGroup() {
      const code = document.getElementById("join-group-code")?.value.trim();
      if (!code) return alert("Введите код приглашения.");
      const { error } = await cloud.rpc("join_waiter_group_by_code", { p_code: code });
      if (error) return alert("Не удалось вступить в группу: " + error.message);
      cloudMessage = "Вы вступили в группу.";
      await refreshCloudSession();
    }

    async function refreshCloudGroup() {
      if (!cloudGroup) return;
      const { data, error } = await cloud.from("waiter_group_members").select("user_id,role,joined_at").eq("group_id", cloudGroup.id);
      if (error) return alert("Не удалось загрузить участников: " + error.message);
      const ids = (data || []).map(m => m.user_id);
      const { data: profiles } = ids.length ? await cloud.from("waiter_profiles").select("user_id,full_name,phone").in("user_id", ids) : { data: [] };
      const byId = Object.fromEntries((profiles || []).map(p => [p.user_id, p]));
      window.waiterGroupProfiles = byId;
      window.waiterGroupMembers = data || [];
      const box = document.getElementById("cloud-members");
      if (box) box.innerHTML = (data || []).map(m => {
        const isSelf = m.user_id === cloudUser.id;
        const profile = byId[m.user_id] || {};
        const title = `${esc(profile.full_name || "Участник без имени")}`;
        const role = m.role === "admin" ? "Администратор" : "Официант";
        return `<button type="button" class="waiter-member-row" onclick="openWaiterProfile('${m.user_id}')">
          <span><strong>${title}${isSelf ? " (вы)" : ""}</strong><small>${role}</small></span>
          <span aria-hidden="true" class="member-chevron">›</span>
        </button>`;
      }).join("") || "Участников пока нет.";
    }

    function openWaiterProfile(userId) {
      const member = (window.waiterGroupMembers || []).find(m => m.user_id === userId);
      if (!member) return;
      const profile = (window.waiterGroupProfiles || {})[userId] || {};
      const isSelf = userId === cloudUser?.id;
      const canRemove = cloudRole === "admin" && !isSelf && member.role !== "admin";
      const backdrop = document.createElement("div");
      backdrop.className = "waiter-profile-backdrop";
      backdrop.id = "waiter-profile-backdrop";
      backdrop.innerHTML = `<section class="waiter-profile-dialog" role="dialog" aria-modal="true" aria-labelledby="waiter-profile-title">
        <h3 id="waiter-profile-title">Анкета официанта</h3>
        <div class="waiter-profile-field"><small>Имя и фамилия</small><strong>${esc(profile.full_name || "Не указано")}</strong></div>
        <div class="waiter-profile-field"><small>Номер телефона</small><strong>${esc(profile.phone || "Не указан")}</strong></div>
        <div class="waiter-profile-field"><small>Роль в группе</small><strong>${member.role === "admin" ? "Администратор" : "Официант"}</strong></div>
        <div class="waiter-profile-actions">
          ${canRemove ? `<button class="danger" onclick="removeWaiterFromGroup('${userId}', true)">Удалить из группы</button>` : ""}
          <button onclick="closeWaiterProfile()">Закрыть</button>
        </div>
      </section>`;
      backdrop.addEventListener("click", event => {
        if (event.target === backdrop) closeWaiterProfile();
      });
      document.body.appendChild(backdrop);
    }

    function closeWaiterProfile() {
      document.getElementById("waiter-profile-backdrop")?.remove();
    }

    async function removeWaiterFromGroup(userId, fromProfile = false) {
      if (!isCloudAdmin()) return alert("Удалять участников может только администратор.");
      if (!userId || userId === cloudUser.id) return alert("Нельзя удалить самого себя этой кнопкой. Используйте «Выйти из группы».");
      if (!confirm("Удалить этого официанта из группы? Он потеряет доступ к общему меню и участникам. Его личные заказы останутся.")) return;
      const { error } = await cloud.rpc("admin_remove_waiter_from_group", { p_user_id: userId });
      if (error) return alert("Не удалось удалить участника: " + error.message);
      closeWaiterProfile();
      cloudMessage = "Официант удалён из группы.";
      await refreshCloudSession();
      if (cloudGroup) await refreshCloudGroup();
    }

    async function leaveWaiterGroup() {
      if (!cloudUser || !cloudGroup) return;
      const isAdmin = cloudRole === "admin";
      const question = isAdmin
        ? "Выйти из группы? Если в группе есть другие участники, права администратора автоматически перейдут самому давно вступившему официанту. Если вы последний участник, группа будет удалена вместе с общим меню."
        : "Выйти из группы? Вы потеряете доступ к её участникам и общему меню. Личные заказы на устройстве останутся.";
      if (!confirm(question)) return;
      const { error } = await cloud.rpc("leave_waiter_group");
      if (error) return alert("Не удалось выйти из группы: " + error.message);
      cloudMessage = "Вы вышли из группы.";
      await refreshCloudSession();
    }

    async function inviteWaiterByPhone() {
      if (!isCloudAdmin()) return alert("Приглашать сотрудников может только администратор.");
      const phone = document.getElementById("invite-phone")?.value.trim();
      if (!phone) return alert("Введите номер телефона.");
      const { error } = await cloud.from("waiter_group_invitations").insert({ group_id: cloudGroup.id, invited_phone: phone, invited_by: cloudUser.id });
      if (error) return alert("Не удалось создать приглашение: " + error.message);
      cloudMessage = "Приглашение создано. Сотрудник увидит его после входа и сохранения такого же номера в профиле.";
      render();
    }

    async function loadMyInvitations() {
      if (!cloudUser) return;
      const { data, error } = await cloud.rpc("list_my_pending_waiter_invitations");
      if (error) return alert("Не удалось проверить приглашения: " + error.message);
      pendingInvitations = data || [];
      render();
    }

    async function acceptPhoneInvitation(id) {
      const { error } = await cloud.rpc("accept_waiter_phone_invitation", { p_invitation_id: id });
      if (error) return alert("Не удалось принять приглашение: " + error.message);
      pendingInvitations = [];
      cloudMessage = "Приглашение принято. Вы добавлены в группу.";
      await refreshCloudSession();
    }

    async function publishSharedMenu() {
      if (!isCloudAdmin()) return alert("Публиковать меню может только администратор.");
      if (!confirm("Опубликовать текущее меню для всех участников группы? Общее меню будет заменено содержимым этого устройства.")) return;
      const { data: oldCats, error: readError } = await cloud.from("shared_menu_categories").select("id").eq("group_id", cloudGroup.id);
      if (readError) return alert("Не удалось проверить общее меню: " + readError.message);
      const { error: delError } = await cloud.from("shared_menu_categories").delete().eq("group_id", cloudGroup.id);
      if (delError) return alert("Не удалось обновить категории: " + delError.message);
      const idMap = {};
      for (let i = 0; i < state.categories.length; i++) {
        const c = state.categories[i];
        const { data, error } = await cloud.from("shared_menu_categories").insert({ group_id: cloudGroup.id, name: c.name, sort_order: i }).select("id").single();
        if (error) return alert("Ошибка публикации категории «" + c.name + "»: " + error.message);
        idMap[c.id] = data.id;
      }
      const rows = state.menu.filter(m => idMap[m.categoryId]).map((m, i) => ({ group_id: cloudGroup.id, category_id: idMap[m.categoryId], name: m.name, sort_order: i, is_available: true }));
      if (rows.length) {
        const { error } = await cloud.from("shared_menu_items").insert(rows);
        if (error) return alert("Ошибка публикации блюд: " + error.message);
      }
      cloudMessage = `Общее меню опубликовано: ${state.categories.length} категорий, ${rows.length} позиций.`;
      render();
    }

    async function downloadSharedMenu() {
      if (!cloudGroup) return;
      const { data: cats, error: cErr } = await cloud.from("shared_menu_categories").select("id,name,sort_order").eq("group_id", cloudGroup.id).order("sort_order");
      if (cErr) return alert("Не удалось загрузить категории: " + cErr.message);
      const { data: items, error: iErr } = await cloud.from("shared_menu_items").select("id,category_id,name,sort_order,is_available").eq("group_id", cloudGroup.id).order("sort_order");
      if (iErr) return alert("Не удалось загрузить блюда: " + iErr.message);
      if (!cats?.length) return alert("Администратор ещё не опубликовал общее меню.");
      if (!confirm("Загрузить общее меню? Текущие локальные категории и блюда будут заменены. Заказы и архив останутся без изменений.")) return;
      const localId = {};
      state.categories = cats.map(c => { const id = makeId(); localId[c.id] = id; return { id, name: c.name }; });
      state.menu = (items || []).filter(i => i.is_available && localId[i.category_id]).map(i => ({ id: makeId(), categoryId: localId[i.category_id], name: i.name }));
      expandedCategoryId = state.categories[0]?.id || null;
      save();
      cloudMessage = "Общее меню загружено/обновлено на этом устройстве. Кнопка загрузки останется доступной; заказы не затронуты.";
      render();
    }

    function renderSentOrders() {
      const rows = sentOrdersCache || [];
      if (!cloudUser) return `<div class="toolbar"><h2>Отправленные заказы</h2></div><div class="empty">Войдите в группу официантов, чтобы видеть отправленные заказы.</div>`;
      if (!rows.length) return `<div class="toolbar"><h2>Отправленные заказы</h2></div><div class="empty">Вы ещё не отправляли заказы коллегам.</div>`;
      return `<div class="toolbar"><h2>Отправленные заказы</h2><button onclick="loadSentOrders()">Обновить</button></div>` +
        rows.map(m => {
          const d = m.order_data || {}, accepted = !!m.accepted_at;
          const dt = new Date(accepted ? m.accepted_at : m.created_at);
          const time = Number.isNaN(dt.getTime()) ? "" : new Intl.DateTimeFormat("ru-RU",{dateStyle:"short",timeStyle:"short"}).format(dt);
          const items = (d.items || []).map(i => `<p>• ${esc(i.name)} × ${Number(i.qty)||1}</p>`).join("");
          return `<section class="card" style="margin-bottom:12px;padding:14px">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
              <strong>Стол №${esc(d.source_table || "—")}</strong>
              <strong style="color:${accepted ? '#16834a' : '#a66b00'}">${accepted ? 'Принят' : 'Ожидает принятия'}</strong>
            </div>
            <p>${accepted ? `Получатель: ${esc(m.recipient_name || 'Официант')}` : `Кому отправлен: ${esc(m.recipient_name || 'Официант')}`}</p>
            <small>${accepted ? 'Принят' : 'Отправлен'}: ${esc(time)}</small>
            <div style="margin-top:8px">${items}</div>
            ${d.comment ? `<p>Комментарий: ${esc(d.comment)}</p>` : ""}
          </section>`;
        }).join("");
    }

    async function syncAcceptedOrdersBackToSender() {
      if (!cloud || !cloudUser) return;
      const { data, error } = await cloud.from("waiter_order_messages")
        .select("id,order_data,accepted_at")
        .eq("sender_id", cloudUser.id).not("accepted_at", "is", null)
        .order("accepted_at", { ascending: false }).limit(100);
      if (error) { console.warn("Accepted orders sync:", error.message); return; }
      let changed = false;
      for (const message of (data || [])) {
        const payload = message.order_data || {};
        if (!payload.source_table_id || !payload.source_bill_id) continue;
        const table = state.tables.find(t => t.id === payload.source_table_id);
        const bills = state.orders?.[payload.source_table_id]?.bills;
        if (!table || !Array.isArray(bills)) continue;
        const nextBills = bills.filter(b => b.id !== payload.source_bill_id);
        if (nextBills.length === bills.length) continue;
        state.orders[payload.source_table_id].bills = nextBills;
        if (!nextBills.length) {
          delete state.orders[payload.source_table_id];
          state.tables = state.tables.filter(t => t.id !== payload.source_table_id);
          if (selectedTableId === payload.source_table_id) selectedTableId = null;
        } else if (state.orders[payload.source_table_id].activeBillId === payload.source_bill_id) {
          state.orders[payload.source_table_id].activeBillId = nextBills[nextBills.length - 1].id;
        }
        changed = true;
      }
      if (changed) { save(); if (view === "tables") render(); }
    }

    async function loadSentOrders() {
      if (!cloud || !cloudUser) { sentOrdersCache = []; if (view === "sent") render(); return; }
      const { data, error } = await cloud.from("waiter_order_messages")
        .select("id,recipient_name,order_data,created_at,accepted_at,accepted_by")
        .eq("sender_id", cloudUser.id).is("accepted_at", null)
        .order("created_at", { ascending: false }).limit(100);
      if (error) { console.warn("Sent orders:", error.message); return; }
      sentOrdersCache = data || [];
      await syncAcceptedOrdersBackToSender();
      if (view === "sent") {
        const app = document.getElementById("app");
        if (app) app.innerHTML = renderSentOrders();
      }
    }

    function renderArchive() {
      if (!state.archive.length) {
        return `
          <div class="toolbar">
            <h2>Архив заказов</h2>
          </div>

          <div class="empty">
            Завершённых заказов пока нет.
          </div>
        `;
      }

      return `
        <div class="toolbar">
          <h2>Архив заказов</h2>
        </div>

        ${state.archive.map((order, index) => {
          const date = new Date(order.finishedAt);

          const dateText = new Intl.DateTimeFormat("ru-RU", {
            dateStyle: "short",
            timeStyle: "short"
          }).format(date);

          return `
            <details class="card" style="margin-bottom:12px">
              <summary style="cursor:pointer;font-weight:700">
                Стол №${esc(order.tableNumber)}
                ${order.billName ? ` · ${esc(order.billName)}` : ""}
                · ${dateText}
              </summary>

              <div class="archive-details">
                ${order.items.map(i => `
                  <p>
                    ${esc(i.name)} — ${i.qty} шт.

                    ${i.comment
                      ? `<br><span class="muted">Комментарий: ${esc(i.comment)}</span>`
                      : ""
                    }
                  </p>
                `).join("")}

                <button class="small danger"
                  onclick="deleteArchiveOrder(${index})">
                  Удалить из архива
                </button>
              </div>
            </details>
          `;
        }).join("")}
      `;
    }

    function deleteArchiveOrder(index) {
      if (!confirm("Удалить заказ из архива?")) return;

      state.archive.splice(index, 1);
      save();
      render();
    }

    function render() {
      document.documentElement.classList.toggle("tables-page", view === "tables");
      document.body.classList.toggle("tables-page", view === "tables");
      document.body.classList.toggle("android-tables", /Android/i.test(navigator.userAgent));
      document.documentElement.classList.toggle("menu-page", view === "menu");
      document.body.classList.toggle("menu-page", view === "menu");
      document.documentElement.classList.toggle("settings-page", view === "settings");
      document.body.classList.toggle("settings-page", view === "settings");

      document.querySelectorAll("nav button").forEach(button => {
        button.classList.remove("active");
      });

      const activeButton = document.getElementById("nav-" + view);

      if (activeButton) {
        activeButton.classList.add("active");
      }

      const app = document.getElementById("app");

      const modal = document.getElementById("orderModal");
      const orderScrollTop = modal.querySelector(".order-screen-scroll")?.scrollTop || 0;
      if (orderModalOpen && view !== "tables") closeOrderModal();
      if (view === "tables") {
        app.innerHTML = renderTables();
        if (orderModalOpen) {
          modal.replaceChildren();
          if (!mountOrderModal(orderScrollTop)) closeOrderModal();
        }
      } else if (view === "menu") {
        app.innerHTML = renderMenu();
      } else if (view === "settings") {
        app.innerHTML = renderSettings();
      } else if (view === "sent") {
        app.innerHTML = renderSentOrders();
        loadSentOrders();
      } else {
        app.innerHTML = renderArchive();
      }
    }

    // ==========================================
    // УПРАВЛЕНИЕ МОБИЛЬНОЙ КЛАВИАТУРОЙ
    // ==========================================

    const keyboardDone = document.getElementById("keyboardDone");

    // Показываем кнопку при выборе поля ввода
    document.addEventListener("focusin", function(event) {
      if (
        event.target.matches("input, textarea") &&
        window.innerWidth <= 760
      ) {
        document.body.classList.add("keyboard-open");
      }
    });

    // Скрываем кнопку после потери фокуса
    document.addEventListener("focusout", function(event) {
      if (event.target.matches("input, textarea")) {
        setTimeout(() => {
          const active = document.activeElement;

          if (!active || !active.matches("input, textarea")) {
            document.body.classList.remove("keyboard-open");
          }
        }, 100);
      }
    });

    // Закрываем клавиатуру по нажатию на кнопку
    keyboardDone.addEventListener("pointerdown", function(event) {
      event.preventDefault();

      if (document.activeElement) {
        document.activeElement.blur();
      }

      document.body.classList.remove("keyboard-open");
    });

    // Native Android Back via Capacitor App; browser history is a fallback.
    const nativeApp = window.Capacitor?.isNativePlatform?.() ? window.Capacitor.Plugins?.App : null;
    const exitDialog = document.getElementById("exitDialog");
    const exitJokes = [
      ["🏝️", "А как же Мальдивы?", "С такими темпами максимум — маршрутка домой."],
      ["💸", "А чаевые?!", "Работа не волк, но чаевые сами себя не принесут."],
      ["👛", "Не бросай меня!", "Твой кошелёк только начал верить в светлое будущее."],
      ["🚗", "А как же Porsche?", "Твой будущий Porsche неодобрительно сигналит."],
      ["☕", "Ещё по кофейку?", "Кофе выпит, а состояние ещё не заработано."],
      ["🛋️", "Домой уже?", "Дома тебя ждёт диван, а здесь — деньги."],
      ["🍽️", "Официант, держись!", "Осталось всего пару столиков… Так говорили ещё три часа назад."],
      ["🛥️", "А яхта?", "Ну всё, сегодня опять без яхты."],
      ["🧮", "Ошибка 402", "Недостаточно чаевых для завершения рабочего дня."],
      ["🏃", "Попытка побега!", "Внимание! Обнаружена попытка побега официанта."]
    ];
    let lastExitJoke = -1;
    function refreshExitJoke() {
      const choices = exitJokes.map((_, i) => i).filter(i => i !== lastExitJoke);
      lastExitJoke = choices[Math.floor(Math.random() * choices.length)];
      const [emoji, title, message] = exitJokes[lastExitJoke];
      exitDialog.querySelector(".exit-icon").textContent = emoji;
      document.getElementById("exitTitle").textContent = title;
      document.getElementById("exitText").textContent = message;
      const coins = exitDialog.querySelector(".exit-coins");
      coins.replaceChildren();
      for (let i = 0; i < 12; i++) {
        const coin = document.createElement("span");
        coin.className = "exit-coin";
        coin.textContent = "₴";
        coin.style.left = `${3 + Math.random() * 88}%`;
        coin.style.animationDelay = `${Math.random() * 1.2}s`;
        coins.append(coin);
      }
    }
    let allowBrowserBack = false;
    let exitFocus = null;
    function hideExitDialog() {
      exitDialog.hidden = true;
      exitFocus?.focus?.({preventScroll:true});
      exitFocus = null;
    }
    function handleExitBack() {
      if (!exitDialog.hidden) { hideExitDialog(); return; }
      if (orderModalOpen) { closeOrderModal(); return; }
      exitFocus = document.activeElement;
      exitFocus?.blur?.();
      refreshExitJoke();
      exitDialog.hidden = false;
      document.getElementById("exitStay").focus({preventScroll:true});
    }
    document.getElementById("exitStay").addEventListener("click", hideExitDialog);
    document.getElementById("exitLeave").addEventListener("click", async () => {
      save();
      if (nativeApp) {
        try { await nativeApp.exitApp(); hideExitDialog(); }
        catch (err) { console.error("Exit failed", err); hideExitDialog(); }
      } else {
        hideExitDialog();
        allowBrowserBack = true;
        history.back();
      }
    });
    exitDialog.addEventListener("keydown", event => {
      if (event.key === "Escape") { event.preventDefault(); hideExitDialog(); }
      if (event.key === "Tab") {
        event.preventDefault();
        document.getElementById(document.activeElement.id === "exitStay" ? "exitLeave" : "exitStay").focus();
      }
    });
    if (nativeApp) {
      try { Promise.resolve(nativeApp.addListener("backButton", handleExitBack)).catch(err => console.error("Back listener failed", err)); } catch (err) { console.error("Back listener failed", err); }
    } else {
      function armExitGuard() { history.pushState({appExitGuard:true}, "", location.href); }
      try { if (!history.state?.appExitGuard) armExitGuard(); } catch (err) { console.error("History guard failed", err); }
      window.addEventListener("popstate", () => {
        if (allowBrowserBack) return;
        armExitGuard();
        handleExitBack();
      });
      window.addEventListener("beforeunload", event => {
        if (!allowBrowserBack) { event.preventDefault(); event.returnValue = ""; }
      });
    }

    // Запуск приложения и восстановление облачной сессии
    render();
    if (cloud) {
      refreshCloudSession().catch(err => console.error("Supabase session error", err));
      cloud.auth.onAuthStateChange(() => {
        refreshCloudSession().catch(err => console.error("Supabase auth refresh error", err));
      });
    }
  </script>
</body>
</html>
